# ── Helm Deck — modal control plane ─────────────────────────────
# One leader (cmd+;) enters mux mode; bare vim keys until esc.
# Sessions note: restore re-executes launch commands — running
# programs are not carried over (kitty has no remote-persistence).

# --on-action end = one-shot (leader per action, tmux-prefix model, safe with no
# mode indicator).
map --new-mode mux --on-unknown beep --on-action end cmd+;

# motions — walk panes
map --mode mux h neighboring_window left
map --mode mux j neighboring_window down
map --mode mux k neighboring_window up
map --mode mux l neighboring_window right

# structure — splits, close, zoom, tabs
map --mode mux v launch --location=vsplit --cwd=current
map --mode mux s launch --location=hsplit --cwd=current
map --mode mux x close_window
map --mode mux z toggle_layout stack
map --mode mux t new_tab

# tab jumps
map --mode mux 1 goto_tab 1
map --mode mux 2 goto_tab 2
map --mode mux 3 goto_tab 3
map --mode mux 4 goto_tab 4
map --mode mux 5 goto_tab 5
map --mode mux 6 goto_tab 6
map --mode mux 7 goto_tab 7
map --mode mux 8 goto_tab 8
map --mode mux 9 goto_tab 9

# sessions
map --mode mux shift+s save_as_session --relocatable --use-foreground-process
map --mode mux g goto_session
map --mode mux space launch --type=overlay --cwd=current zsh -ic "bun ~/.config/kitty/deck/DeckBar.ts"

# exit
map --mode mux escape pop_keyboard_mode
