# LifeOS Kitty Terminal Config — live-controlled tab bar, vim-style splits, Tokyo Night Storm
# Optional: LifeOS works in any terminal. This is the reference setup the
# docs describe (DOCUMENTATION/Terminal/Helm.md).

# Window Management
remember_window_size no
initial_window_width 75c
initial_window_height 65c
window_padding_width 16
confirm_os_window_close 0
enabled_layouts splits,tall,fat,horizontal,vertical,grid,stack

# Tab Bar Styling — top by default; TabBar.ts flips it to a left sidebar live
tab_bar_edge top
# custom = tab_bar.py: top-edge tabs share the full window width dynamically
tab_bar_style custom
tab_bar_min_tabs 1
# Sidebar width: kitty defaults the vertical bar to ~20 title cells. Do NOT set
# tab_title_max_length here — setting it in the conf broke bar rendering on
# reload (kitty 0.48.2); width is driven live by TabBar.ts overrides instead.
tab_title_template "{('◉ ' + keyboard_mode.upper() + ' ') if keyboard_mode else ''}{((bell_symbol + activity_symbol) + ' ') if (bell_symbol or activity_symbol) else ''}{title}"
active_tab_foreground   #c0caf5
active_tab_background   #1244B3
active_tab_font_style   bold
inactive_tab_foreground #787c99
inactive_tab_background #1a1b26
inactive_tab_font_style normal

# Shell Integration
shell_integration enabled
shell zsh

# Theme - Tokyo Night Storm with custom colors
background #24283b
foreground #c0caf5
selection_background #775095
selection_foreground #c0caf5

# Cursor
cursor #bb9af7
cursor_text_color #24283b
cursor_shape block
cursor_blink_interval 0

# Colors - Tokyo Night Storm palette
color0  #1a1b26
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #a9b1d6

color8  #414868
color9  #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5

# Fonts — install Hack Nerd Font first: brew install --cask font-hack-nerd-font
font_family Hack Nerd Font
bold_font Hack Nerd Font Bold
italic_font Hack Nerd Font Italic
bold_italic_font Hack Nerd Font Bold Italic
font_size 16.0
font_features +liga
disable_ligatures never
text_composition_strategy 1.0 20

# Keyboard Shortcuts
# Config reload
map shift+cmd+r load_config_file

# Tab management
map cmd+t new_tab
map cmd+w close_tab
map ctrl+t next_tab

# Launch a new DA session (new tab + run your assistant's launch alias, e.g. 'k')
# Adjust "k" to whatever command starts your assistant.
map cmd+shift+n launch --type=tab --cwd=current zsh -ic "k"

# Window/Split management - Create new panes with Cmd+Shift
# Right/Left use vsplit (vertical divider = side by side)
# Down/Up use hsplit (horizontal divider = stacked)
map cmd+shift+l launch --location=vsplit --cwd=current
map cmd+shift+j launch --location=hsplit --cwd=current
# Left/Up: split then move the new window before the original
map cmd+shift+h combine | launch --location=vsplit --cwd=current | move_window left
map cmd+shift+k combine | launch --location=hsplit --cwd=current | move_window up

# Navigate between tabs with Ctrl+H/L
map ctrl+h previous_tab
map ctrl+l next_tab

# Tab bar live control — TabBar.ts (needs bun: https://bun.sh)
# Alt+Shift+L/H: widen/narrow (vim) · Ctrl+Cmd+D: dock to mini icons · Ctrl+Cmd+B: hide/show · Ctrl+Cmd+E: toggle top/left edge
map alt+shift+l launch --type=background zsh -ic "bun ~/.config/kitty/TabBar.ts expand"
map alt+shift+h launch --type=background zsh -ic "bun ~/.config/kitty/TabBar.ts contract"
map ctrl+cmd+d launch --type=background zsh -ic "bun ~/.config/kitty/TabBar.ts dock"
map ctrl+cmd+b launch --type=background zsh -ic "bun ~/.config/kitty/TabBar.ts hide"
map ctrl+cmd+e launch --type=background zsh -ic "bun ~/.config/kitty/TabBar.ts edge"

# Move tabs left/right (reorder position)
map ctrl+shift+h move_tab_backward
map ctrl+shift+l move_tab_forward

# Navigate between panes (vim-style) - using Cmd
map cmd+h neighboring_window left
map cmd+j neighboring_window down
map cmd+k neighboring_window up
map cmd+l neighboring_window right

# Resize windows - using Ctrl+Cmd (native kitty resize)
map ctrl+cmd+h resize_window narrower
map ctrl+cmd+l resize_window wider
map ctrl+cmd+k resize_window taller
map ctrl+cmd+j resize_window shorter

# Scrollback
scrollback_lines 10000
scrollback_pager_history_size 10

# Mouse
hide_window_decorations titlebar-only
mouse_hide_wait 0

# Background
# Note: background_opacity must be 1.0 for background images to work properly
# Use background_tint to control image opacity instead
background_opacity 1.0
dynamic_background_opacity no
background_blur 0

# Background Image (optional — point at your own image and uncomment)
# background_image ~/terminal-background.jpg
# Use 'cscaled' to scale and center, preserving aspect ratio
background_image_layout cscaled
# Tint: Higher value = brighter image (1.0 = full brightness)
background_tint 0.96

# Selection/Clipboard
copy_on_select yes
strip_trailing_spaces smart
clipboard_control write-clipboard write-primary read-clipboard read-primary

# macOS Specific
macos_option_as_alt yes
macos_titlebar_color background
macos_traditional_fullscreen no
macos_show_window_title_in all
macos_custom_beam_cursor yes
macos_thicken_font 0.75

# Performance
repaint_delay 10
input_delay 3
sync_to_monitor yes

# URLs
url_style curly
open_url_with default
detect_urls yes
url_prefixes file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh

# Helm Deck — modal mux mode + project sessions (see deck.conf)
include deck.conf

# Special key mappings for newline
map shift+enter send_text all \n
# Ctrl+Enter for ZSH autosuggestion completion
map ctrl+enter send_text all \x1b[27;5;13~

# Window borders and margins
window_border_width 0pt
draw_minimal_borders yes
active_border_color #bb9af7
inactive_border_color #414868
bell_border_color #e0af68

# Bell
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell no

# Advanced — remote control lets LifeOS hooks paint tab titles/colors
allow_remote_control socket-only
listen_on unix:/tmp/kitty

# Clear the green "done" tab stamp on first view (done-cleared-on-view)
watcher ${HOME}/.config/kitty/cairn_clear_watcher.py

# Left-edge bar auto-fit: refit the sidebar width when tab titles change
watcher ${HOME}/.config/kitty/tab_refit_watcher.py
update_check_interval 0
startup_session none
allow_hyperlinks yes
