# LIFEOS_CONFIG.toml — user-owned LifeOS configuration
#
# Bootstrap default. The LifeOS Setup + Interview fill in your real values.
# Canonical source for principal identity, DA identity, voice config, integration
# credentials, and path roots. System code reads these through
# LIFEOS/TOOLS/LifeosConfig.ts (loadLifeosConfig()). Secrets stay in ~/.claude/.env — never here.
#
# This file lives under LIFEOS/USER/CONFIG/ (USER zone) — it never ships in a public
# release with real values; this is the clean scaffold. It is yours; edit freely.
#
# Schema reference: the `LifeosConfig` interface in LIFEOS/TOOLS/LifeosConfig.ts.

[principal]
name = "Your Name"                 # required — your display name
pronunciation = ""                 # optional — phonetic spelling if needed
timezone = "America/Los_Angeles"   # required — IANA timezone
hometown = ""                      # optional
currency = "USD"                   # optional — ISO 4217, drives Pulse Finances tab formatting

[da]
name = "Aria"                      # required — your DA's name (rename to anything)
full_name = ""
display_name = ""
color = "#3B82F6"

[da.voices.main]
voice_id = "21m00Tcm4TlvDq8ikWAM"  # required — ElevenLabs voice_id (public default; set yours in Interview)
voice_name = "Rachel"
stability = 0.85
similarity_boost = 0.7
style = 0.3
speed = 1.0
use_speaker_boost = true
volume = 1.0

[integrations.cloudflare]
# Token lives in ~/.claude/.env (never here). Account ID is non-secret.
token_env_var = "CLOUDFLARE_API_TOKEN"

[paths]
user_dir = "~/.claude/LIFEOS/USER"
projects_dir = "~/Projects"

[launch]
# Where a `lifeos` session starts. These values are the built-in defaults and
# reproduce stock behaviour exactly: every session cd's to the config root. An
# older config with no [launch] block behaves identically.
#
#   "config-root"        cd to default_dir (this default)
#   "stay"               stay in the launch directory, always
#   "stay-if-permitted"  stay when under a permitted root, else default_dir
cwd_mode = "config-root"

# Where config-root mode lands, and where --home forces a session regardless
# of the current directory.
default_dir = "~/.claude"

# Only consulted in stay-if-permitted mode. Accepts literal paths ("~/...",
# "/...", "${HOME}/...") and @-sentinels:
#
#   @config-root     the config root (~/.claude)
#   @config-paths    [paths].user_dir and [paths].projects_dir, above
#   @settings-allow  roots parsed from settings.json permissions.allow Edit() rules
#
# Matching is lexical and prefix-based against the visible path, so "~/Projects"
# matches "~/Projects/thing" but not "~/Projects-old". No globbing. An unknown
# sentinel is an error, not a silent skip. See DOCUMENTATION/Config/ConfigSystem.md.
permitted_roots = ["@config-root", "@config-paths"]
